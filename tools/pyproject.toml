[project]
name = "omphalos-tools"
version = "0.1.0"
description = "omphalos tooling: GGUF inspection, the NumPy reference forward pass, and the checks of the engine against the golden dump"
readme = "README.md"
authors = [
    { name = "Nihmar", email = "manente.alessandro@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "gguf>=0.19.0",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
