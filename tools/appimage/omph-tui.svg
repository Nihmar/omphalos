<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="omph-tui">
  <!-- omph-tui's icon (#534): a terminal mark, shapes only (no text and no font, so
       rsvg-convert renders the same pixels wherever the AppImage is built). The
       chevron is the shell's prompt, the block the cursor: the two claims the UI
       makes everywhere, one keystroke or one click per action. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1e2a38"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ad8ff"/>
      <stop offset="1" stop-color="#3fa9e8"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f8fc"/>
      <stop offset="1" stop-color="#c9d8e4"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#31414f" stroke-width="3"/>
  <!-- the prompt chevron -->
  <path d="M84 86 L126 128 L84 170" fill="none" stroke="url(#accent)" stroke-width="23"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the cursor -->
  <rect x="147" y="146" width="57" height="23" rx="11.5" fill="url(#cursor)"/>
</svg>
