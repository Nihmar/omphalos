<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf0"/>
      <stop offset="1" stop-color="#ddf2fc"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="48" fill="#ffd76a" opacity="0.3"/>
  <circle cx="680" cy="80" r="34" fill="#ffd76a"/>

  <!-- Clouds (seamless loop) -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="45" ry="18"/>
    <ellipse cx="180" cy="78" rx="32" ry="15"/>
    <ellipse cx="105" cy="80" rx="26" ry="13"/>
    <ellipse cx="520" cy="150" rx="50" ry="20"/>
    <ellipse cx="565" cy="138" rx="30" ry="14"/>
    <ellipse cx="478" cy="140" rx="24" ry="12"/>
    <ellipse cx="940" cy="90" rx="45" ry="18"/>
    <ellipse cx="980" cy="78" rx="32" ry="15"/>
    <ellipse cx="905" cy="80" rx="26" ry="13"/>
    <ellipse cx="1320" cy="150" rx="50" ry="20"/>
    <ellipse cx="1365" cy="138" rx="30" ry="14"/>
    <ellipse cx="1278" cy="140" rx="24" ry="12"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="40s" repeatCount="indefinite"/>
  </g>

  <!-- Ground -->
  <rect y="450" width="800" height="50" fill="#8bc34a"/>
  <rect y="450" width="800" height="6" fill="#79b348"/>

  <!-- Scrolling ground texture -->
  <g fill="#79b348">
    <ellipse cx="40" cy="466" rx="16" ry="4"/>
    <ellipse cx="120" cy="480" rx="12" ry="3"/>
    <ellipse cx="200" cy="466" rx="16" ry="4"/>
    <ellipse cx="280" cy="480" rx="12" ry="3"/>
    <ellipse cx="360" cy="466" rx="16" ry="4"/>
    <ellipse cx="440" cy="480" rx="12" ry="3"/>
    <ellipse cx="520" cy="466" rx="16" ry="4"/>
    <ellipse cx="600" cy="480" rx="12" ry="3"/>
    <ellipse cx="680" cy="466" rx="16" ry="4"/>
    <ellipse cx="760" cy="480" rx="12" ry="3"/>
    <ellipse cx="840" cy="466" rx="16" ry="4"/>
    <ellipse cx="920" cy="480" rx="12" ry="3"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.28s" repeatCount="indefinite"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="400" cy="452" rx="195" ry="9" fill="#000000" opacity="0.12"/>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="215" x2="185" y2="215"/>
    <line x1="90" y1="275" x2="175" y2="275"/>
    <line x1="115" y1="335" x2="190" y2="335"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -25 0; 0 0" dur="0.45s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.15;0.65" dur="0.45s" repeatCount="indefinite"/>
  </g>

  <!-- Far crank + pedal (behind frame) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 380" to="360 350 380" dur="1s" repeatCount="indefinite"/>
    <line x1="350" y1="380" x2="350" y2="415" stroke="#1d1d1d" stroke-width="6"/>
    <g>
      <rect x="336" y="411" width="28" height="8" rx="3" fill="#1d1d1d"/>
      <animateTransform attributeName="transform" type="rotate" from="0 350 415" to="-360 350 415" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Rear wheel -->
  <g>
    <circle cx="250" cy="380" r="70" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <circle cx="250" cy="380" r="61" fill="none" stroke="#c8ccd0" stroke-width="3"/>
    <g stroke="#9aa0a6" stroke-width="2">
      <line x1="250" y1="319" x2="250" y2="441"/>
      <line x1="189" y1="380" x2="311" y2="380"/>
      <line x1="207" y1="337" x2="293" y2="423"/>
      <line x1="293" y1="337" x2="207" y2="423"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 380" to="360 250 380" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="250" cy="380" r="6" fill="#555555"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="550" cy="380" r="70" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <circle cx="550" cy="380" r="61" fill="none" stroke="#c8ccd0" stroke-width="3"/>
    <g stroke="#9aa0a6" stroke-width="2">
      <line x1="550" y1="319" x2="550" y2="441"/>
      <line x1="489" y1="380" x2="611" y2="380"/>
      <line x1="507" y1="337" x2="593" y2="423"/>
      <line x1="593" y1="337" x2="507" y2="423"/>
      <animateTransform attributeName="transform" type="rotate" from="0 550 380" to="360 550 380" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="550" cy="380" r="6" fill="#555555"/>
  </g>

  <!-- Frame -->
  <g stroke="#d64545" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 380 L350 380 L330 265 Z"/>
    <path d="M350 380 L520 275"/>
    <path d="M330 265 L520 275"/>
  </g>
  <g stroke="#333333" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M520 275 L550 380"/>
    <path d="M520 275 L512 250"/>
    <path d="M512 250 Q494 242 488 258"/>
    <line x1="330" y1="265" x2="322" y2="238"/>
  </g>
  <rect x="296" y="228" width="46" height="11" rx="5.5" fill="#333333"/>

  <!-- Chainring, cog, chain -->
  <circle cx="350" cy="380" r="12" fill="none" stroke="#555555" stroke-width="3"/>
  <circle cx="250" cy="380" r="6" fill="#555555"/>
  <path d="M350 368 L250 374" stroke="#444444" stroke-width="3" stroke-dasharray="7 5" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="12" dur="0.25s" repeatCount="indefinite"/>
  </path>
  <path d="M350 392 L250 386" stroke="#444444" stroke-width="3" stroke-dasharray="7 5" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="0.25s" repeatCount="indefinite"/>
  </path>

  <!-- Near crank + pedal (in front of frame) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 380" to="360 350 380" dur="1s" repeatCount="indefinite"/>
    <line x1="350" y1="380" x2="350" y2="345" stroke="#333333" stroke-width="6"/>
    <g>
      <rect x="336" y="341" width="28" height="8" rx="3" fill="#333333"/>
      <animateTransform attributeName="transform" type="rotate" from="0 350 345" to="-360 350 345" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- Far leg -->
    <path fill="none" stroke="#d18a1f" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
        values="M332 240 Q346 330 350 413;
                M332 240 Q322 300 315 378;
                M332 240 Q342 292 350 343;
                M332 240 Q362 300 385 378;
                M332 240 Q346 330 350 413"/>
    </path>

    <!-- Tail -->
    <path d="M284 172 L250 152 L258 192 Z" fill="#e8e0d0"/>

    <!-- Body -->
    <ellipse cx="330" cy="185" rx="58" ry="52" fill="#fdf6ec" transform="rotate(-8 330 185)"/>

    <!-- Wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 305 165; -7 305 165; 0 305 165" dur="1s" repeatCount="indefinite"/>
      <path d="M302 158 Q345 140 374 172 Q362 212 318 214 Q292 196 302 158 Z" fill="#e8e0d0"/>
      <path d="M314 172 Q338 162 356 178" stroke="#d8cfbc" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M310 190 Q334 182 352 198" stroke="#d8cfbc" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Neck, head, beak -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 372 162; -4 372 162; 0 372 162" dur="0.5s" repeatCount="indefinite"/>
      <path d="M368 162 Q398 150 408 130" stroke="#fdf6ec" stroke-width="18" fill="none" stroke-linecap="round"/>
      <circle cx="412" cy="122" r="20" fill="#fdf6ec"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 428 124; 3 428 124; 0 428 124" dur="0.5s" repeatCount="indefinite"/>
        <path d="M428 114 L508 134 Q492 162 456 168 Q430 158 426 130 Z" fill="#f5a623"/>
        <path d="M436 134 Q446 154 462 158 Q478 152 492 143 Q464 134 436 134 Z" fill="#e08b1a"/>
        <path d="M430 129 L506 137" stroke="#c97a12" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <circle cx="419" cy="115" r="3.5" fill="#222222"/>
      <circle cx="420.5" cy="113.5" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Near leg -->
    <path fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
        values="M332 240 Q342 292 350 343;
                M332 240 Q362 300 385 378;
                M332 240 Q346 330 350 413;
                M332 240 Q322 300 315 378;
                M332 240 Q342 292 350 343"/>
    </path>
  </g>
</svg>