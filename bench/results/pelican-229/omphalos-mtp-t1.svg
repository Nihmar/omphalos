<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Pelican riding a bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d9f7"/>
      <stop offset="1" stop-color="#e9f6ff"/>
    </linearGradient>
  </defs>

  <!-- Sky, sun, hills -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="700" cy="90" r="38" fill="#ffe9a3"/>
  <ellipse cx="190" cy="440" rx="170" ry="62" fill="#b7c9ae"/>
  <ellipse cx="560" cy="440" rx="230" ry="74" fill="#a6bd9f"/>

  <!-- Drifting clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="950" cy="90" rx="46" ry="18"/>
      <ellipse cx="988" cy="98" rx="34" ry="15"/>
      <ellipse cx="912" cy="99" rx="30" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1260 0" dur="28s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="950" cy="150" rx="36" ry="14"/>
      <ellipse cx="980" cy="157" rx="26" ry="11"/>
      <ellipse cx="920" cy="158" rx="24" ry="10"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1260 0" dur="34s" begin="-15s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Road with moving lane dashes -->
  <rect x="0" y="440" width="800" height="60" fill="#8d97a5"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#77828f" stroke-width="4"/>
  <line x1="0" y1="472" x2="800" y2="472" stroke="#f6f4ea" stroke-width="6" stroke-dasharray="45 35">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.11s" repeatCount="indefinite"/>
  </line>

  <!-- Whole rig bobs up and down -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- Rear wheel -->
    <g>
      <circle cx="255" cy="385" r="55" fill="none" stroke="#23272e" stroke-width="7"/>
      <circle cx="255" cy="385" r="48" fill="none" stroke="#cfd6de" stroke-width="3"/>
      <line x1="207" y1="385" x2="303" y2="385" stroke="#8b93a0" stroke-width="3"/>
      <line x1="231" y1="343.4" x2="279" y2="426.6" stroke="#8b93a0" stroke-width="3"/>
      <line x1="279" y1="343.4" x2="231" y2="426.6" stroke="#8b93a0" stroke-width="3"/>
      <circle cx="255" cy="385" r="12" fill="none" stroke="#4e5560" stroke-width="3"/>
      <circle cx="255" cy="385" r="7.5" fill="#4d5560"/>
      <animateTransform attributeName="transform" type="rotate" from="0 255 385" to="360 255 385" dur="0.45s" repeatCount="indefinite"/>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="550" cy="385" r="55" fill="none" stroke="#23272e" stroke-width="7"/>
      <circle cx="550" cy="385" r="48" fill="none" stroke="#cfd6de" stroke-width="3"/>
      <line x1="502" y1="385" x2="598" y2="385" stroke="#8b93a0" stroke-width="3"/>
      <line x1="526" y1="343.4" x2="574" y2="426.6" stroke="#8b93a0" stroke-width="3"/>
      <line x1="574" y1="343.4" x2="526" y2="426.6" stroke="#8b93a0" stroke-width="3"/>
      <circle cx="550" cy="385" r="7.5" fill="#4d5560"/>
      <animateTransform attributeName="transform" type="rotate" from="0 550 385" to="360 550 385" dur="0.45s" repeatCount="indefinite"/>
    </g>

    <!-- Far leg (behind the frame) -->
    <polyline fill="none" stroke="#6b7280" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
      points="338,272 363,335 361,382">
      <animate attributeName="points" dur="1s" repeatCount="indefinite" values="
        338,272 363,335 361,382; 338,272 366,327 368,365; 338,272 375,323 385,358;
        338,272 383,327 402,365; 338,272 385,335 409,382; 338,272 383,344 402,399;
        338,272 375,347 385,406; 338,272 366,344 368,399; 338,272 363,335 361,382"/>
    </polyline>

    <!-- Frame -->
    <g fill="none" stroke="#d9503c" stroke-width="7" stroke-linecap="round">
      <line x1="255" y1="385" x2="349" y2="297"/>
      <line x1="255" y1="385" x2="385" y2="382"/>
      <line x1="385" y1="382" x2="347" y2="296"/>
      <line x1="349" y1="297" x2="506" y2="291"/>
      <line x1="385" y1="382" x2="508" y2="293"/>
      <line x1="508" y1="292" x2="550" y2="385" stroke-width="6"/>
      <line x1="507" y1="291" x2="502" y2="258" stroke-width="6"/>
      <path d="M502,258 Q518,249 536,253" stroke-width="6"/>
    </g>
    <circle cx="536" cy="253" r="4" fill="#33383f"/>
    <line x1="347" y1="296" x2="341" y2="288" stroke="#454c57" stroke-width="5"/>
    <path d="M316,286 Q338,277 362,286 Q340,294 316,286 Z" fill="#3a3f4a"/>

    <!-- Chain (animated links) -->
    <line x1="385" y1="367" x2="255" y2="373" stroke="#4e5560" stroke-width="3.5" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="385" y1="397" x2="255" y2="397" stroke="#4e5560" stroke-width="3.5" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="0.15s" repeatCount="indefinite"/>
    </line>

    <!-- Crank + pedals -->
    <g>
      <line x1="385" y1="382" x2="361" y2="382" stroke="#383e48" stroke-width="5"/>
      <rect x="352.5" y="378" width="17" height="8" rx="2" fill="#2c313a"/>
      <line x1="385" y1="382" x2="409" y2="382" stroke="#383e48" stroke-width="5"/>
      <rect x="400.5" y="378" width="17" height="8" rx="2" fill="#2c313a"/>
      <circle cx="385" cy="382" r="15" fill="none" stroke="#454c57" stroke-width="4"/>
      <circle cx="385" cy="382" r="4" fill="#2c313a"/>
      <animateTransform attributeName="transform" type="rotate" from="0 385 382" to="360 385 382" dur="1s" repeatCount="indefinite"/>
    </g>

    <!-- Pelican body -->
    <path d="M247,230 L222,248 L252,254 Z" fill="#4c515c"/>
    <ellipse cx="305" cy="232" rx="60" ry="44" fill="#f7f1e1"/>
    <path d="M280,222 C300,196 338,198 352,222 C336,240 300,242 280,222 Z" fill="#e6dcc4">
      <animateTransform attributeName="transform" type="rotate" values="0 288 224; -7 288 224; 0 288 224" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Wing used as handlebar grip -->
    <path d="M352,230 C415,238 480,246 528,252" fill="none" stroke="#f7f1e1" stroke-width="13" stroke-linecap="round"/>
    <g stroke="#f7f1e1" stroke-width="3" stroke-linecap="round">
      <circle cx="530" cy="252" r="6" fill="#f7f1e1" stroke="none"/>
      <line x1="530" y1="252" x2="540" y2="245"/>
      <line x1="530" y1="252" x2="544" y2="252"/>
      <line x1="530" y1="252" x2="538" y2="260"/>
    </g>

    <!-- Near leg (in front) -->
    <polyline fill="none" stroke="#4a4f5a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
      points="338,272 385,335 409,382">
      <animate attributeName="points" dur="1s" repeatCount="indefinite" values="
        338,272 385,335 409,382; 338,272 383,344 402,399; 338,272 375,347 385,406;
        338,272 366,344 368,399; 338,272 363,335 361,382; 338,272 366,327 368,365;
        338,272 375,323 385,358; 338,272 383,327 402,365; 338,272 385,335 409,382"/>
    </polyline>

    <!-- Neck and head -->
    <g>
      <path d="M348,215 C355,175 395,168 424,150" fill="none" stroke="#f7f1e1" stroke-width="17" stroke-linecap="round"/>
      <circle cx="428" cy="147" r="12" fill="#f7f1e1"/>
      <path d="M421,139 Q414,130 420,127 Q426,131 423,139 Z" fill="#f4a53a"/>
      <path d="M432,140 L512,152 L432,155 Z" fill="#f4a53a"/>
      <path d="M433,154 C460,188 492,172 508,152 C484,161 456,160 433,154 Z" fill="#e08a2c">
        <animateTransform attributeName="transform" type="rotate" values="0 433 154; 5 433 154; 0 433 154" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="430" cy="143" r="2.6" fill="#1d1d1f"/>
      <animateTransform attributeName="transform" type="rotate" values="0 348 215; 3.5 348 215; 0 348 215" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>