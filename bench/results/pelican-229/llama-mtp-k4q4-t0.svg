<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican pedals a red bicycle past a scrolling landscape.</desc>

  <!-- Sky -->
  <rect width="800" height="450" fill="#BDE4F5"/>

  <!-- Sun -->
  <circle cx="705" cy="75" r="38" fill="#FFD95E"/>

  <!-- Drifting clouds (slow parallax) -->
  <g fill="#FFFFFF" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="24s" repeatCount="indefinite"/>
      <g>
        <ellipse cx="140" cy="85" rx="48" ry="18"/>
        <ellipse cx="185" cy="72" rx="34" ry="15"/>
        <ellipse cx="100" cy="75" rx="30" ry="14"/>
      </g>
      <g>
        <ellipse cx="480" cy="130" rx="52" ry="18"/>
        <ellipse cx="530" cy="118" rx="34" ry="14"/>
        <ellipse cx="440" cy="120" rx="30" ry="13"/>
      </g>
      <!-- duplicates for a seamless loop -->
      <g>
        <ellipse cx="940" cy="85" rx="48" ry="18"/>
        <ellipse cx="985" cy="72" rx="34" ry="15"/>
        <ellipse cx="900" cy="75" rx="30" ry="14"/>
      </g>
      <g>
        <ellipse cx="1280" cy="130" rx="52" ry="18"/>
        <ellipse cx="1330" cy="118" rx="34" ry="14"/>
        <ellipse cx="1240" cy="120" rx="30" ry="13"/>
      </g>
    </g>
  </g>

  <!-- Scrolling bushes (mid parallax) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="3s" repeatCount="indefinite"/>
    <g fill="#5E9E3E">
      <circle cx="90" cy="352" r="24"/>
      <circle cx="120" cy="358" r="18"/>
      <circle cx="400" cy="355" r="20"/>
      <circle cx="640" cy="352" r="26"/>
      <circle cx="672" cy="358" r="18"/>
      <!-- duplicates for a seamless loop -->
      <circle cx="890" cy="352" r="24"/>
      <circle cx="920" cy="358" r="18"/>
      <circle cx="1200" cy="355" r="20"/>
      <circle cx="1440" cy="352" r="26"/>
      <circle cx="1472" cy="358" r="18"/>
    </g>
  </g>

  <!-- Road and grass -->
  <rect y="360" width="800" height="22" fill="#5A5A5A"/>
  <rect y="382" width="800" height="68" fill="#7CB85C"/>

  <!-- Scrolling road dashes -->
  <line x1="-60" y1="371" x2="860" y2="371" stroke="#F4F4F4" stroke-width="4" stroke-dasharray="34 34">
    <animate attributeName="stroke-dashoffset" from="0" to="68" dur="0.25s" repeatCount="indefinite"/>
  </line>

  <!-- Soft shadow under the bike -->
  <ellipse cx="350" cy="363" rx="170" ry="6" fill="#000000" opacity="0.15"/>

  <!-- Flickering speed lines -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="240" x2="170" y2="240">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="285" x2="150" y2="285">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.7s" begin="0.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= BIKE + PELICAN (gentle bob) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- Rear wheel -->
    <circle cx="240" cy="305" r="55" fill="none" stroke="#2E2E2E" stroke-width="7"/>
    <g stroke="#8A8A8A" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 240 305" to="360 240 305" dur="1s" repeatCount="indefinite"/>
      <line x1="240" y1="252" x2="240" y2="358"/>
      <line x1="187" y1="305" x2="293" y2="305"/>
      <line x1="203" y1="268" x2="277" y2="342"/>
      <line x1="277" y1="268" x2="203" y2="342"/>
    </g>
    <circle cx="240" cy="305" r="7" fill="#2E2E2E"/>

    <!-- Front wheel -->
    <circle cx="460" cy="305" r="55" fill="none" stroke="#2E2E2E" stroke-width="7"/>
    <g stroke="#8A8A8A" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 460 305" to="360 460 305" dur="1s" repeatCount="indefinite"/>
      <line x1="460" y1="252" x2="460" y2="358"/>
      <line x1="407" y1="305" x2="513" y2="305"/>
      <line x1="423" y1="268" x2="497" y2="342"/>
      <line x1="497" y1="268" x2="423" y2="342"/>
    </g>
    <circle cx="460" cy="305" r="7" fill="#2E2E2E"/>

    <!-- Far-side leg (behind the frame) -->
    <line x1="296" y1="210" x2="300" y2="305" stroke="#D97B1E" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" values="300;308.8;330;351.2;360;351.2;330;308.8;300" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="305;283.8;275;283.8;305;326.2;335;326.2;305" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Chain and chainring -->
    <g stroke="#555555" stroke-width="2.5">
      <line x1="240" y1="297" x2="330" y2="293"/>
      <line x1="240" y1="313" x2="330" y2="317"/>
    </g>
    <circle cx="330" cy="305" r="12" fill="none" stroke="#555555" stroke-width="3"/>

    <!-- Frame -->
    <g stroke="#C0392B" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="240" y1="305" x2="330" y2="305"/>
      <line x1="330" y1="305" x2="272" y2="212"/>
      <line x1="240" y1="305" x2="272" y2="212"/>
      <line x1="330" y1="305" x2="448" y2="218"/>
      <line x1="272" y1="212" x2="448" y2="218"/>
      <line x1="448" y1="218" x2="460" y2="305"/>
      <line x1="448" y1="218" x2="444" y2="198"/>
      <line x1="272" y1="212" x2="272" y2="206"/>
    </g>
    <line x1="444" y1="198" x2="458" y2="196" stroke="#2E2E2E" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="272" cy="207" rx="17" ry="5" fill="#2E2E2E"/>

    <!-- Crank and pedals (rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 330 305" to="360 330 305" dur="1s" repeatCount="indefinite"/>
      <line x1="330" y1="305" x2="360" y2="305" stroke="#444444" stroke-width="5"/>
      <line x1="330" y1="305" x2="300" y2="305" stroke="#444444" stroke-width="5"/>
      <rect x="352" y="300" width="18" height="8" rx="2" fill="#222222"/>
      <rect x="290" y="300" width="18" height="8" rx="2" fill="#222222"/>
    </g>
    <circle cx="330" cy="305" r="6" fill="#555555"/>

    <!-- Pelican -->
    <g>
      <!-- tail -->
      <path d="M 238 172 L 208 160 L 216 188 Z" fill="#F7EFDC"/>
      <!-- body -->
      <ellipse cx="280" cy="182" rx="48" ry="30" fill="#FDF6E3"/>
      <!-- wing (subtle flap) -->
      <ellipse cx="270" cy="186" rx="30" ry="18" fill="#EADFC4">
        <animateTransform attributeName="transform" type="rotate" values="0 292 178; -6 292 178; 0 292 178" dur="0.5s" repeatCount="indefinite"/>
      </ellipse>
      <!-- neck -->
      <path d="M 306 168 C 316 150 324 140 340 130" stroke="#FDF6E3" stroke-width="16" fill="none" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="344" cy="126" r="15" fill="#FDF6E3"/>
      <!-- beak and pouch -->
      <path d="M 351 119 L 418 129 L 351 133 Z" fill="#F5A623"/>
      <path d="M 352 132 C 368 156 402 156 417 130 C 400 143 368 143 352 132 Z" fill="#E8891A"/>
      <!-- eye -->
      <circle cx="347" cy="121" r="3.5" fill="#222222"/>
      <circle cx="348.5" cy="119.5" r="1.2" fill="#FFFFFF"/>
      <!-- wing-arm reaching the handlebar -->
      <path d="M 292 176 C 330 172 392 182 446 197" stroke="#FDF6E3" stroke-width="11" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Near-side leg (in front of the body) -->
    <line x1="302" y1="208" x2="360" y2="305" stroke="#F5A623" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" values="360;351.2;330;308.8;300;308.8;330;351.2;360" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="305;326.2;335;326.2;305;283.8;275;283.8;305" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>