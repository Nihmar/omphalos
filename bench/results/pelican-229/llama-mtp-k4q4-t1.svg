<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400">
  <title>Pelican riding a bicycle</title>

  <defs>
    <g id="wheel">
      <circle r="55" fill="none" stroke="#1f2937" stroke-width="8"/>
      <g stroke="#374151" stroke-width="4">
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
      </g>
      <circle r="7" fill="#111827"/>
    </g>
  </defs>

  <rect width="800" height="400" fill="#bae6fd"/>
  <rect y="330" width="800" height="70" fill="#86efac"/>

  <line x1="0" y1="350" x2="800" y2="350" stroke="#f8fafc" stroke-width="6" stroke-dasharray="50 30">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="1s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(210 295)">
    <g>
      <use xlink:href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(410 295)">
    <g>
      <use xlink:href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="210" y1="295" x2="300" y2="295"/>
    <line x1="210" y1="295" x2="250" y2="225"/>
    <line x1="250" y1="225" x2="300" y2="295"/>
    <line x1="300" y1="295" x2="370" y2="235"/>
    <line x1="250" y1="225" x2="370" y2="235"/>
    <line x1="370" y1="235" x2="410" y2="295"/>
    <line x1="370" y1="235" x2="380" y2="212"/>
    <line x1="365" y1="212" x2="395" y2="212"/>

    <ellipse cx="250" cy="222" rx="18" ry="7" fill="#111827" stroke="none"/>
    <circle cx="300" cy="295" r="6" fill="#111827" stroke="none"/>
  </g>

  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -4;0 0;0 -4;0 0"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="1s"
      repeatCount="indefinite"
    />

    <path d="M220 180 Q185 170 195 145 Q220 155 235 165 Z" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <ellipse cx="265" cy="185" rx="55" ry="32" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <ellipse cx="255" cy="190" rx="35" ry="18" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <ellipse cx="305" cy="155" rx="15" ry="30" fill="#ffffff" stroke="#334155" stroke-width="3" transform="rotate(-10 305 155)"/>
    <circle cx="322" cy="120" r="18" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <circle cx="328" cy="115" r="3" fill="#111827"/>

    <path d="M325 118 L395 124 L395 132 L330 132 Z" fill="#fdba74" stroke="#334155" stroke-width="2"/>
    <path d="M330 132 Q355 175 395 132 Q370 142 330 138 Z" fill="#fb923c" stroke="#334155" stroke-width="2"/>
  </g>

  <g transform="translate(300 295)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="20" cy="0" rx="9" ry="5" fill="#f97316"/>
      <ellipse cx="-20" cy="0" rx="9" ry="5" fill="#f97316"/>
    </g>
  </g>
</svg>