<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 450" width="800" height="450">
  <title>Pelican riding a bicycle</title>

  <defs>
    <g id="wheel">
      <circle r="55" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <g stroke="#9aa0a6" stroke-width="2.5">
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
      </g>
      <circle r="7" fill="#2b2b2b"/>
    </g>
    <g id="cloud" fill="#ffffff" opacity="0.95">
      <ellipse cx="0" cy="0" rx="55" ry="20"/>
      <ellipse cx="35" cy="-14" rx="38" ry="17"/>
      <ellipse cx="-35" cy="-10" rx="32" ry="15"/>
    </g>
  </defs>

  <!-- sky and sun -->
  <rect width="800" height="450" fill="#bfe6ff"/>
  <circle cx="705" cy="75" r="38" fill="#ffd93b"/>

  <!-- scrolling clouds -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-800 0" dur="16s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" x="150" y="85"/>
    <use xlink:href="#cloud" x="520" y="130"/>
    <use xlink:href="#cloud" x="950" y="85"/>
    <use xlink:href="#cloud" x="1320" y="130"/>
  </g>

  <!-- road -->
  <rect y="355" width="800" height="95" fill="#8d99ae"/>
  <g fill="#f1f3f5">
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-800 0" dur="4.65s" repeatCount="indefinite"/>
    <g>
      <rect x="0" y="398" width="55" height="6" rx="3"/>
      <rect x="100" y="398" width="55" height="6" rx="3"/>
      <rect x="200" y="398" width="55" height="6" rx="3"/>
      <rect x="300" y="398" width="55" height="6" rx="3"/>
      <rect x="400" y="398" width="55" height="6" rx="3"/>
      <rect x="500" y="398" width="55" height="6" rx="3"/>
      <rect x="600" y="398" width="55" height="6" rx="3"/>
      <rect x="700" y="398" width="55" height="6" rx="3"/>
      <rect x="800" y="398" width="55" height="6" rx="3"/>
      <rect x="900" y="398" width="55" height="6" rx="3"/>
      <rect x="1000" y="398" width="55" height="6" rx="3"/>
      <rect x="1100" y="398" width="55" height="6" rx="3"/>
      <rect x="1200" y="398" width="55" height="6" rx="3"/>
      <rect x="1300" y="398" width="55" height="6" rx="3"/>
      <rect x="1400" y="398" width="55" height="6" rx="3"/>
      <rect x="1500" y="398" width="55" height="6" rx="3"/>
    </g>
  </g>

  <!-- rider (whole group bobs up and down) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3; 0 0" dur="1s" repeatCount="indefinite"/>

    <!-- far leg (behind the bike) -->
    <path fill="none" stroke="#e08e1b" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" dur="1s" begin="-0.5s" repeatCount="indefinite"
        values="M322 180 C330 215 342 245 350 274;
                M322 180 C335 215 365 260 376 300;
                M322 180 C330 225 350 275 350 326;
                M322 180 C320 220 322 260 324 300;
                M322 180 C330 215 342 245 350 274"/>
    </path>

    <!-- wheels -->
    <g transform="translate(240 300)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        <use xlink:href="#wheel"/>
      </g>
    </g>
    <g transform="translate(460 300)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        <use xlink:href="#wheel"/>
      </g>
    </g>

    <!-- frame -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M240 300 L320 195 L350 300 Z"/>
      <path d="M350 300 L435 200 L320 195"/>
      <path d="M435 200 L460 300"/>
    </g>

    <!-- chain -->
    <path d="M240 291 L350 289 M240 309 L350 311" stroke="#555" stroke-width="3" stroke-dasharray="5 3" fill="none"/>

    <!-- seat post + seat -->
    <line x1="320" y1="195" x2="316" y2="176" stroke="#444" stroke-width="5"/>
    <rect x="300" y="170" width="32" height="8" rx="4" fill="#333"/>

    <!-- handlebar -->
    <line x1="435" y1="200" x2="430" y2="180" stroke="#444" stroke-width="5"/>
    <path d="M430 180 C424 170 412 170 406 178" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- crank + pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 300" to="360 350 300" dur="1s" repeatCount="indefinite"/>
      <line x1="350" y1="300" x2="350" y2="274" stroke="#444" stroke-width="5"/>
      <line x1="350" y1="300" x2="350" y2="326" stroke="#444" stroke-width="5"/>
      <rect x="341" y="269" width="18" height="6" rx="2" fill="#222"/>
      <rect x="341" y="325" width="18" height="6" rx="2" fill="#222"/>
    </g>
    <circle cx="350" cy="300" r="11" fill="none" stroke="#444" stroke-width="3"/>

    <!-- near leg -->
    <path fill="none" stroke="#f5a623" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M322 180 C330 215 342 245 350 274;
                M322 180 C335 215 365 260 376 300;
                M322 180 C330 225 350 275 350 326;
                M322 180 C320 220 322 260 324 300;
                M322 180 C330 215 342 245 350 274"/>
    </path>

    <!-- pelican -->
    <path d="M245 150 L218 138 L238 168 Z" fill="#d8d8d8"/>
    <ellipse cx="292" cy="150" rx="52" ry="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

    <!-- flapping wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 300 145; -8 300 145; 0 300 145" dur="1s" repeatCount="indefinite"/>
      <path d="M268 132 C246 140 240 168 258 182 C280 192 308 182 314 158 C312 142 290 128 268 132 Z" fill="#cfd4da"/>
    </g>

    <!-- neck, head, beak (gentle sway) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 325 140; 4 325 140; 0 325 140; -3 325 140; 0 325 140" dur="2.5s" repeatCount="indefinite"/>
      <path d="M322 142 C352 132 372 116 386 98" stroke="#ffffff" stroke-width="17" fill="none" stroke-linecap="round"/>
      <circle cx="390" cy="92" r="15" fill="#ffffff"/>
      <path d="M398 84 L470 100 C462 118 432 128 406 106 Z" fill="#f5a623"/>
      <path d="M400 93 L466 101" stroke="#d18a1f" stroke-width="2"/>
      <circle cx="394" cy="87" r="2.8" fill="#222"/>
    </g>
  </g>
</svg>