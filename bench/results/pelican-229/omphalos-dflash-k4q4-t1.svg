<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Pelican riding a bicycle</title>
  <desc>A pelican pedals a red bicycle down a road; wheels, pedals and background animate.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3F5"/>
      <stop offset="1" stop-color="#EAF7FD"/>
    </linearGradient>

    <g id="clouds" fill="#FFFFFF">
      <ellipse cx="120" cy="92" rx="45" ry="18"/>
      <ellipse cx="152" cy="80" rx="30" ry="14"/>
      <ellipse cx="95"  cy="82" rx="26" ry="12"/>
      <ellipse cx="420" cy="62" rx="50" ry="20"/>
      <ellipse cx="455" cy="50" rx="32" ry="15"/>
      <ellipse cx="388" cy="52" rx="28" ry="13"/>
      <ellipse cx="660" cy="122" rx="40" ry="16"/>
      <ellipse cx="690" cy="112" rx="26" ry="12"/>
    </g>

    <path id="hillsBack"  d="M 0 430 L 0 388 Q 100 352 200 388 Q 300 352 400 388 Q 500 352 600 388 Q 700 352 800 388 L 800 430 Z"/>
    <path id="hillsFront" d="M 0 430 L 0 388 Q 100 344 200 388 Q 300 344 400 388 Q 500 344 600 388 Q 700 344 800 388 L 800 430 Z"/>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="800" height="444" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="44" fill="#FFF3C9" opacity="0.5"/>
  <circle cx="690" cy="80" r="30" fill="#FFE08A"/>

  <!-- drifting clouds (seamless loop) -->
  <g opacity="0.9">
    <use href="#clouds"/>
    <use href="#clouds" x="800"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="26s" repeatCount="indefinite"/>
  </g>

  <!-- parallax hills -->
  <g fill="#C2E2C6">
    <use href="#hillsBack"/>
    <use href="#hillsBack" x="800"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="46s" repeatCount="indefinite"/>
  </g>
  <g fill="#9CCF92">
    <use href="#hillsFront"/>
    <use href="#hillsFront" x="800"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="30s" repeatCount="indefinite"/>
  </g>

  <!-- verge + road -->
  <rect y="430" width="800" height="14" fill="#7FBF6B"/>
  <rect y="444" width="800" height="56" fill="#8E979E"/>

  <!-- moving lane dashes (matches wheel speed) -->
  <g>
    <line x1="-100" y1="470" x2="900" y2="470" stroke="#F2F5F7" stroke-width="9" stroke-dasharray="60 40"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.29s" repeatCount="indefinite"/>
  </g>

  <!-- speed lines behind the rider -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <g>
      <line x1="150" y1="205" x2="205" y2="205"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="0.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="130" y1="240" x2="195" y2="240"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.6s" begin="-0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="0.6s" begin="-0.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="150" y1="275" x2="210" y2="275"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.6s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="0.6s" begin="-0.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===================== BIKE + PELICAN ===================== -->

  <!-- far leg (pedalling) -->
  <path fill="none" stroke="#C97F1B" stroke-width="5" stroke-linecap="round"
        d="M 294 250 Q 346 330 336 385">
    <animate attributeName="d" dur="1s" begin="-0.5s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1"
      values="M 294 250 Q 346 330 336 385;
              M 294 250 Q 336 362 310 411;
              M 294 250 Q 320 344 284 385;
              M 294 250 Q 326 306 310 359;
              M 294 250 Q 346 330 336 385"/>
  </path>

  <!-- rear wheel -->
  <g>
    <g stroke="#98A0A8" stroke-width="2">
      <line x1="195" y1="385" x2="285" y2="385"/>
      <line x1="240" y1="340" x2="240" y2="430"/>
      <line x1="208.2" y1="353.2" x2="271.8" y2="416.8"/>
      <line x1="208.2" y1="416.8" x2="271.8" y2="353.2"/>
      <animateTransform attributeName="transform" type="rotate" from="0 240 385" to="360 240 385" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle cx="240" cy="385" r="45" fill="none" stroke="#7A828B" stroke-width="3"/>
    <circle cx="240" cy="385" r="55" fill="none" stroke="#2B2F35" stroke-width="8"/>
    <circle cx="240" cy="385" r="6" fill="#2B2F35"/>
  </g>

  <!-- front wheel -->
  <g>
    <g stroke="#98A0A8" stroke-width="2">
      <line x1="415" y1="385" x2="505" y2="385"/>
      <line x1="460" y1="340" x2="460" y2="430"/>
      <line x1="428.2" y1="353.2" x2="491.8" y2="416.8"/>
      <line x1="428.2" y1="416.8" x2="491.8" y2="353.2"/>
      <animateTransform attributeName="transform" type="rotate" from="0 460 385" to="360 460 385" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle cx="460" cy="385" r="45" fill="none" stroke="#7A828B" stroke-width="3"/>
    <circle cx="460" cy="385" r="55" fill="none" stroke="#2B2F35" stroke-width="8"/>
    <circle cx="460" cy="385" r="6" fill="#2B2F35"/>
  </g>

  <!-- chain -->
  <g stroke="#5A6169" stroke-width="3" stroke-dasharray="5 3" fill="none">
    <path d="M 240 377 L 310 372">
      <animate attributeName="stroke-dashoffset" from="0" to="-8" dur="0.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 240 393 L 310 398"/>
  </g>
  <circle cx="240" cy="385" r="8" fill="none" stroke="#5A6169" stroke-width="3"/>

  <!-- frame -->
  <g stroke="#D64545" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="240" y1="385" x2="310" y2="385"/>  <!-- chainstay -->
    <line x1="240" y1="385" x2="272" y2="278"/>  <!-- seat stay -->
    <line x1="310" y1="385" x2="272" y2="278"/>  <!-- seat tube -->
    <line x1="272" y1="278" x2="444" y2="286"/>  <!-- top tube -->
    <line x1="310" y1="385" x2="444" y2="286"/>  <!-- down tube -->
  </g>
  <line x1="444" y1="286" x2="460" y2="385" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/> <!-- fork -->
  <line x1="444" y1="286" x2="436" y2="262" stroke="#2E3238" stroke-width="5" stroke-linecap="round"/> <!-- stem -->
  <line x1="436" y1="262" x2="424" y2="268" stroke="#22252A" stroke-width="7" stroke-linecap="round"/> <!-- grip -->
  <rect x="248" y="270" width="48" height="10" rx="5" fill="#4A3728"/> <!-- saddle -->

  <!-- crank + pedals (rotates in sync with the legs) -->
  <g>
    <circle cx="310" cy="385" r="13" fill="none" stroke="#3A3F45" stroke-width="4"/>
    <line x1="310" y1="385" x2="336" y2="385" stroke="#3A3F45" stroke-width="5" stroke-linecap="round"/>
    <line x1="310" y1="385" x2="284" y2="385" stroke="#3A3F45" stroke-width="5" stroke-linecap="round"/>
    <line x1="327" y1="385" x2="345" y2="385" stroke="#22252A" stroke-width="7" stroke-linecap="round"/>
    <line x1="275" y1="385" x2="293" y2="385" stroke="#22252A" stroke-width="7" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 310 385" to="360 310 385" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- pelican (gently bobs) -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="0.5s" repeatCount="indefinite"
      values="0 0; 0 3; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- tail -->
    <path d="M 232 218 L 202 204 L 236 230 Z" fill="#E4EBF0" stroke="#33383D" stroke-width="2"/>

    <!-- body -->
    <ellipse cx="278" cy="222" rx="50" ry="34" transform="rotate(-10 278 222)"
             fill="#F7FAFB" stroke="#33383D" stroke-width="2.5"/>

    <!-- folded wing (tiny flap) -->
    <g>
      <path d="M 268 210 C 246 218 238 240 252 256 C 268 266 292 260 300 244 C 302 228 288 214 268 210 Z"
            fill="#E4EBF0" stroke="#33383D" stroke-width="2"/>
      <path d="M 254 226 q 10 2 22 8 M 252 238 q 12 4 26 8" fill="none" stroke="#C3CED6" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
        values="0 296 226; -8 296 226; 0 296 226" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </g>

    <!-- neck (outline then fill) -->
    <path d="M 306 216 C 344 204 356 172 358 146 C 359 132 368 122 382 118"
          fill="none" stroke="#33383D" stroke-width="25" stroke-linecap="round"/>
    <path d="M 306 216 C 344 204 356 172 358 146 C 359 132 368 122 382 118"
          fill="none" stroke="#F7FAFB" stroke-width="20" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="386" cy="120" r="14" fill="#F7FAFB" stroke="#33383D" stroke-width="2.5"/>
    <circle cx="391" cy="116" r="2.2" fill="#1B1E21"/>

    <!-- upper beak -->
    <path d="M 396 112 L 466 124 L 398 128 Z" fill="#F7B733" stroke="#33383D" stroke-width="2" stroke-linejoin="round"/>

    <!-- throat pouch (sways) -->
    <path d="M 398 127 C 414 158 452 152 464 126 C 448 136 418 140 398 127 Z"
          fill="#E2881F" stroke="#33383D" stroke-width="2" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
        values="0 400 127; 5 400 127; 0 400 127" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>
  </g>

  <!-- near leg (pedalling, half-phase from far leg) -->
  <path fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round"
        d="M 294 250 Q 346 330 336 385">
    <animate attributeName="d" dur="1s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1"
      values="M 294 250 Q 346 330 336 385;
              M 294 250 Q 336 362 310 411;
              M 294 250 Q 320 344 284 385;
              M 294 250 Q 326 306 310 359;
              M 294 250 Q 346 330 336 385"/>
  </path>
</svg>