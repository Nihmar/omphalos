<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <!-- Ground -->
  <rect y="265" width="400" height="35" fill="#6B8E23"/>
  <line x1="0" y1="265" x2="400" y2="265" stroke="#556B2F" stroke-width="2"/>

  <!-- === BICYCLE === -->
  <g>
    <!-- Rear wheel -->
    <g transform="translate(100,225)">
      <circle r="40" fill="none" stroke="#333" stroke-width="4"/>
      <g>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#666" stroke-width="1.5"/>
        <line x1="-40" y1="0" x2="40" y2="0" stroke="#666" stroke-width="1.5"/>
        <line x1="-28" y1="-28" x2="28" y2="28" stroke="#666" stroke-width="1.5"/>
        <line x1="-28" y1="28" x2="28" y2="-28" stroke="#666" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      </g>
      <circle r="4" fill="#333"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(260,225)">
      <circle r="40" fill="none" stroke="#333" stroke-width="4"/>
      <g>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#666" stroke-width="1.5"/>
        <line x1="-40" y1="0" x2="40" y2="0" stroke="#666" stroke-width="1.5"/>
        <line x1="-28" y1="-28" x2="28" y2="28" stroke="#666" stroke-width="1.5"/>
        <line x1="-28" y1="28" x2="28" y2="-28" stroke="#666" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      </g>
      <circle r="4" fill="#333"/>
    </g>

    <!-- Frame -->
    <line x1="100" y1="225" x2="175" y2="225" stroke="#C0392B" stroke-width="3.5"/>
    <line x1="100" y1="225" x2="145" y2="158" stroke="#C0392B" stroke-width="3.5"/>
    <line x1="145" y1="158" x2="175" y2="225" stroke="#C0392B" stroke-width="3.5"/>
    <line x1="175" y1="225" x2="260" y2="225" stroke="#C0392B" stroke-width="3.5"/>
    <line x1="145" y1="158" x2="245" y2="148" stroke="#C0392B" stroke-width="3.5"/>
    <line x1="245" y1="148" x2="260" y2="225" stroke="#C0392B" stroke-width="3.5"/>

    <!-- Seat -->
    <ellipse cx="145" cy="155" rx="13" ry="5" fill="#222"/>

    <!-- Handlebars -->
    <path d="M245,148 Q255,138 262,142" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Crank + pedals -->
    <g transform="translate(175,225)">
      <circle r="7" fill="none" stroke="#444" stroke-width="2"/>
      <g>
        <line x1="0" y1="0" x2="18" y2="0" stroke="#444" stroke-width="3"/>
        <rect x="14" y="-4" width="10" height="8" rx="2" fill="#222"/>
        <line x1="0" y1="0" x2="-18" y2="0" stroke="#444" stroke-width="3"/>
        <rect x="-24" y="-4" width="10" height="8" rx="2" fill="#222"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- === PELICAN === -->
  <g>
    <!-- Bob animation -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0" dur="1s" repeatCount="indefinite"/>

    <!-- Legs (pedaling motion) -->
    <path fill="none" stroke="#F5D76E" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M150,148 Q145,190 157,218;
               M150,148 Q150,192 175,207;
               M150,148 Q158,190 193,225;
               M150,148 Q150,192 175,243;
               M150,148 Q145,190 157,218"/>
    </path>
    <path fill="none" stroke="#E8C84A" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M160,148 Q168,190 193,225;
               M160,148 Q168,192 175,243;
               M160,148 Q162,190 157,218;
               M160,148 Q168,192 175,207;
               M160,148 Q168,190 193,225"/>
    </path>

    <!-- Body -->
    <ellipse cx="155" cy="130" rx="42" ry="26" fill="white" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Wing -->
    <path d="M135,125 Q115,138 130,152 Q145,148 152,136" fill="#EAEAEA" stroke="#ccc" stroke-width="1"/>

    <!-- Tail feathers -->
    <path d="M113,124 Q98,118 92,124 Q98,130 113,132" fill="#EAEAEA" stroke="#ccc" stroke-width="1"/>

    <!-- Neck -->
    <path d="M190,118 Q205,98 212,82" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <path d="M190,118 Q205,98 212,82" fill="none" stroke="#e0e0e0" stroke-width="12" stroke-linecap="round" opacity="0.3"/>

    <!-- Head -->
    <circle cx="215" cy="76" r="14" fill="white" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Eye -->
    <circle cx="220" cy="72" r="3.5" fill="#333"/>
    <circle cx="221.5" cy="70.5" r="1.2" fill="white"/>

    <!-- Beak -->
    <path d="M226,72 L278,79 Q282,82 278,85 L226,82 Z" fill="#F39C12" stroke="#E67E22" stroke-width="1"/>
    <!-- Throat pouch -->
    <path d="M226,82 Q248,104 272,85" fill="#F5B041" stroke="#E67E22" stroke-width="1"/>

    <!-- Crest -->
    <path d="M208,64 Q212,58 216,62" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>